[project]
# Package metadata and runtime dependencies; Python 3.12 is pinned for Intel Mac wheels.
name = "evidencelens"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    # NumPy constraint for Intel Mac compatibility with torch
    "numpy<2",
    # serving
    "fastapi>=0.143", "uvicorn[standard]", "pydantic>=2.14", "pydantic-settings>=2.15", "httpx", "tenacity", "typer", "rich",
    # stores (removed [fastembed] to avoid onnxruntime Intel Mac wheel errors)
    "elasticsearch[async]>=9.5,<10", "qdrant-client>=1.19", "neo4j>=6.4",
    # LLM / orchestration
    "langchain>=1.4", "langgraph>=1.2", "langchain-openai", "langchain-qdrant",
    "llama-index-core>=0.14",
    # models (pinned for Intel Mac compatibility)
    "torch==2.2.2",
    "torchvision==0.17.2",
    "sentence-transformers>=3.0",
    "transformers>=4.38,<4.44",
    "huggingface-hub<3",
    # data
    "polars>=0.20", "duckdb", "pyarrow", "lxml", "datasketch", "dvc",
    # crawl/parse
    "scrapy>=2.11", "trafilatura",
    # eval / ops
    "mlflow>=2.10", "langfuse>=2", "presidio-analyzer", "presidio-anonymizer",
]

[dependency-groups]
# Tooling and evaluation dependencies are installed by `uv sync` for contributors.
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "beir", "deepeval", "ragas", "scikit-learn"]

# CPU wheels and NumPy <2 are intentional compatibility pins for this Intel Mac.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.uv]
environments = ["sys_platform == 'darwin' and python_version == '3.12'"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Make `src/` importable during tests without requiring a package build/install.
markers = ["integration: needs docker services", "llm: needs an LLM endpoint"]
pythonpath = ["src"]