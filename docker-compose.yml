name: evidencelens
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=change-me
      - xpack.security.http.ssl.enabled=false
    mem_limit: 1.5g
    ulimits: { memlock: { soft: -1, hard: -1 } }
    ports: ["127.0.0.1:9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      - QDRANT__SERVICE__API_KEY=change-me
    mem_limit: 1g
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  neo4j:
    image: neo4j:2026.07.1
    environment:
      - NEO4J_AUTH=neo4j/change-me-too
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_server_memory_heap_max__size=512M
    mem_limit: 1g
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [./data/neo4j:/data]

volumes: { es-data: {}, qdrant-data: {} }
